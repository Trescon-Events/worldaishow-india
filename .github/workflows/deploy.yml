name: Deploy Next.js site to Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rewrite basePath for GitHub Pages (/worldaishow-india)
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (/\.(ts|tsx|js|jsx|json|css|html)$/.test(entry.name)) {
                  const content = fs.readFileSync(full, "utf8");
                  if (content.includes("/enterprise")) {
                    fs.writeFileSync(full, content.split("/enterprise").join("/worldaishow-india"), "utf8");
                  }
                }
              }
            }
            walk("src");
            const cfg = fs.readFileSync("next.config.ts", "utf8");
            fs.writeFileSync("next.config.ts", cfg.split("/enterprise").join("/worldaishow-india"), "utf8");
          '

      - name: Build with Next.js
        run: npm run build

      - name: Add .nojekyll to out/
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
